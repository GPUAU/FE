name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # AWS 인증이 필요 없어 GitHub 제공 러너에서 실행한다(PR 코드를 캠퍼스 PC에서 돌리지 않음).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JS syntax check
        run: |
          for f in docker_erd_20261117/app/web/static/*.js; do node --check "$f"; done
      - name: Frontend tests
        run: node --test tests/*.test.mjs
      - name: Monte Carlo tests
        run: |
          python -m unittest discover -s montecarlo/engine -p tests.py
          python -m unittest discover -s montecarlo -p 'test*.py'
      - name: Python syntax check
        run: python -m py_compile serve.py
  web:
    # 새 Vue 앱(web/) 테스트와 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
