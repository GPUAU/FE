apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: u1-3
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx-unprivileged 이미지의 nginx 사용자
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL          # nginx가 /api/v1을 넘길 BE 주소
              value: http://backend.u1-3.svc.cluster.local
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: u1-3
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: u1-3
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "110.10.153.80/28,175.114.173.160/28"
    # 캠퍼스 안에서도 브라우저 로그인 창(HTTP Basic Auth)을 띄운다.
    # gpu-basic-auth Secret(키: auth, 값: htpasswd 한 줄)은 팀 포털에서 먼저 생성해야 한다. 없으면 503.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: gpu-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "GPU AU - team only"
    # 원가 에이전트 업로드: 기본 1MB를 넘으면 ingress가 413을 돌려줘 앱의 안내 문구가 보이지 않는다.
    # cost-agent 합계 한도 20MB + 여유, 스캔 PDF OCR 시간까지 (FE nginx /agent 설정과 맞춤)
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - u1-3.skala-us.com
      secretName: team-tls
  rules:
    - host: u1-3.skala-us.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
